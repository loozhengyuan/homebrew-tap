name: bump

on:
  schedule:
    - cron: "0 10 * * *" # Daily at 18:00hrs SGT
  workflow_dispatch:

defaults:
  run:
    # NOTE: Default option does not include `-o pipefail` as documented
    # unless explicitly specifying the `bash` shell.
    # https://github.com/actions/runner/issues/353
    shell: bash

jobs:
  bump:
    name: bump
    runs-on: macos-15
    timeout-minutes: 10
    # NOTE: The `GITHUB_TOKEN` used by `brew bump` requires write access to
    # contents for pushing the bump branch and pull requests for opening the PR.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@07a2e10c5e201418f928690f897aaff92cf24d3a # master

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      # NOTE: Formulae/Casks with the same name can conflict when running `brew bump`
      # so we manually untap them as a workaround.
      - name: Untap official formulae/casks
        run: |
          brew untap homebrew/core
          brew untap homebrew/cask

      # NOTE: Non-official taps must be explicitly trusted since Homebrew 6.0.0
      # and `brew bump --tap` loads all formulae/casks within the tap.
      # https://docs.brew.sh/Tap-Trust
      - name: Trust tap
        run: |
          brew trust loozhengyuan/tap

      # NOTE: The commit email address should be the canonical no-reply email address
      # used by the `github-actions[bot]` bot user.
      # https://api.github.com/users/github-actions%5Bbot%5D
      # https://github.community/t/github-actions-bot-email-address/17204/6
      - name: Set up git config
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      # NOTE: The `brew bump` command is used instead of `brew bump-formula-pr`
      # and `brew bump-cask-pr` because it handles fetching the latest version
      # and operates on all formulae/casks within a tap.
      - name: Bump packages
        env:
          # NOTE: Creating PRs using `GITHUB_TOKEN` requires the "Allow GitHub
          # Actions to create and approve pull requests" option to be enabled
          # in the repository settings (Settings > Actions > General > Workflow
          # permissions).
          # https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-github-actions-settings-for-a-repository#preventing-github-actions-from-creating-or-approving-pull-requests
          #
          # NOTE: PRs created using `GITHUB_TOKEN` will trigger CI runs in an
          # approval-required state, so a user with write access must select
          # "Approve workflows to run" on the PR before CI runs.
          # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew bump --open-pr --no-fork --tap loozhengyuan/tap
